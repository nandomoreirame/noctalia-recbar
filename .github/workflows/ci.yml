name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  # Pin to match Arch extra/luau (local setup). Bump when upgrading locally.
  LUAU_VERSION: "0.742"

jobs:
  test:
    name: Luau tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Luau CLI
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL \
            "https://github.com/luau-lang/luau/releases/download/${LUAU_VERSION}/luau-ubuntu.zip" \
            -o /tmp/luau-ubuntu.zip
          unzip -o /tmp/luau-ubuntu.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin"/luau*
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify luau
        run: command -v luau && luau --help | head -n 5

      - name: Run plugin tests
        run: ./run-tests

      - name: Lint plugin (when noctalia CLI is available)
        run: |
          if command -v noctalia >/dev/null 2>&1; then
            noctalia plugins lint .
          else
            echo "noctalia CLI not on PATH; skipping plugins lint"
          fi
